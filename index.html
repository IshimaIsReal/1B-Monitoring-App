<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring System</title>
    <link rel ="stylesheet" href ="style.css">
</head>

<body>

    <header>
        <img src="pic.png" alt="PowerLink Alert" class="Monitor">
        <h2 class ="Monitor-App">Monitor</h2>
        <nav class="navigation" aria-label="Main navigation">
            <button class="btnLogin-popup" type="button">Login</button>
        </nav>
    </header>

    <div class="wrapper active-popup">
        <span class="icon-close"><ion-icon name="close-outline"></ion-icon></span>
        <div class="form-box login">
            <h2>Login</h2>
            <form id="login-form" action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input id="login-email" name="email" type="email" placeholder=" " autocomplete="email" required>
                    <label for="login-email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon toggle-password" role="button" tabindex="0" aria-label="Show password"><ion-icon name="eye-off-outline"></ion-icon></span>
                    <input id="login-password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
                    <label for="login-password">Password</label>
                </div>
                <div class="remember-forgot">
                    <a href="#" id="forgot-password-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="auth-feedback" id="login-feedback" role="status" aria-live="polite"></p>
                <div class="login-register">
                    <p>Don't have an account? <a href="#" class="register-link">Register</a></p>

                </div>
            </form>
        </div>

        <div class="form-box register">
            <h2>Registration</h2>
            <form id="register-form" action="#">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person-outline"></ion-icon>
                    </span>
                    <input id="register-username" name="username" type="text" placeholder=" " autocomplete="username" required>
                    <label for="register-username">Username</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input id="register-email" name="email" type="email" placeholder=" " autocomplete="email" required>
                    <label for="register-email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon toggle-password" role="button" tabindex="0" aria-label="Show password"><ion-icon name="eye-off-outline"></ion-icon></span>
                    <input id="register-password" name="password" type="password" placeholder=" " autocomplete="new-password" minlength="8" required>
                    <label for="register-password">Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" required>I agree to the terms & conditions</label>
                
                </div>
                <button type="submit"
                class="btn">Register</button>
                <p class="auth-feedback" id="register-feedback" role="status" aria-live="polite"></p>
                <div class="login-register">
                    <p>Already have an account? <a 
                        href="#"
                        class="login-link">Login</a></p>
                </div>
            </form>
        </div>

        <div class="form-box reset">
            <h2>Reset password</h2>
            <form id="reset-form" action="#">
                <div id="reset-request-fields">
                    <div class="input-box">
                        <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                        <input id="reset-email" name="email" type="email" placeholder=" " autocomplete="email" required>
                        <label for="reset-email">Account email</label>
                    </div>
                    <p class="reset-note">We’ll email you a secure link to reset your password.</p>
                </div>
                <div id="reset-password-fields" hidden>
                    <div class="input-box">
                        <span class="icon toggle-password" role="button" tabindex="0" aria-label="Show password"><ion-icon name="eye-off-outline"></ion-icon></span>
                        <input id="reset-password" name="password" type="password" placeholder=" " autocomplete="new-password" minlength="8">
                        <label for="reset-password">New password</label>
                    </div>
                    <div class="input-box">
                        <span class="icon toggle-password" role="button" tabindex="0" aria-label="Show password"><ion-icon name="eye-off-outline"></ion-icon></span>
                        <input id="confirm-password" name="confirmPassword" type="password" placeholder=" " autocomplete="new-password" minlength="8">
                        <label for="confirm-password">Confirm new password</label>
                    </div>
                    <p class="reset-note">Choose a new password for your account.</p>
                </div>
                <button type="submit" class="btn">Send reset link</button>
                <p class="auth-feedback" id="reset-feedback" role="status" aria-live="polite"></p>
                <div class="login-register">
                    <p>Remembered it? <a href="#" id="reset-login-link">Back to login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
